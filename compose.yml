services:
  backend:
    image: smash-or-pass-backend:latest
    build:
      context: ./backend
    env_file:
      - .env.production
    command:
      - sh
      - -c
      - npx prisma migrate deploy && node dist/src/server.js
    restart: unless-stopped
    networks:
      - application

  image-worker:
    image: smash-or-pass-backend:latest
    env_file:
      - .env.production
    command:
      - node
      - dist/src/workers/image-processing.worker.js
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - application

  frontend:
    image: smash-or-pass-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    networks:
      - application

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - application

networks:
  application:
    driver: bridge